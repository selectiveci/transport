---
name: "pre-release"

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release - ${{ matrix.platform.release_for }}
    strategy:
      matrix:
        platform:
          - release_for: Linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: transport
            name: transport-Linux-x86_64.tar.gz
            command: build

          - release_for: Linux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            bin: transport
            name: transport-Linux-aarch64.tar.gz
            command: build

          - release_for: macOS-aarch64
            os: macOS-latest
            target: aarch64-apple-darwin
            bin: transport
            name: transport-Darwin-aarch64.tar.gz
            command: build

          - release_for: macOS-x86_64
            os: macOS-latest
            target: x86_64-apple-darwin
            bin: transport
            name: transport-Darwin-x86_64.tar.gz
            command: build

          - release_for: Linux-musl-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            bin: transport
            name: transport-Linux-musl-x86_64.tar.gz
            command: build

          - release_for: Linux-musl-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            bin: transport
            name: transport-Linux-musl-aarch64.tar.gz
            command: build

          - release_for: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: transport.exe
            name: transport-Windows-x86_64.tar.gz
            command: build

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: ${{ matrix.platform.command }}
          target: ${{ matrix.platform.target }}
          args: "--locked --release"

      - name: Package as archive
        shell: bash
        run: |
          cd target/${{ matrix.platform.target }}/release
          tar czvf ../../../${{ matrix.platform.name }} ${{ matrix.platform.bin }}
          cd -
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.platform.name }} > ${{ matrix.platform.name }}.sha256
          else
            shasum -a 256 ${{ matrix.platform.name }} > ${{ matrix.platform.name }}.sha256
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            transport-*
            *.sha256
